<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>film</title>
<!--
  Deterministic film template. Contract (see references/engine.md):
  - window.seek(t) draws the frame for time t (seconds). Pure function of t: no CSS transitions,
    no timers, no requestAnimationFrame, no Date.now, no unseeded Math.random, no state between calls.
  - window.ready = true only after fonts and images are decoded.
  - window.FILM = { duration, fps } is read by scripts/render.mjs.
  - Query params: ?w=1080&h=1920 (format), ?t=3.2 (preview one frame), ?play (real-time preview).
-->
<style>
  :root { --bg:#0b0b0c; --ink:#f5f5f2; --accent:#7c5cff; --muted:#8a8a93; }
  html, body { margin:0; background:var(--bg); overflow:hidden; }
  #stage { position:absolute; left:0; top:0; overflow:hidden; background:var(--bg);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); }
  #cam   { position:absolute; inset:0; transform-origin:50% 50%; }
  .layer { position:absolute; left:0; top:0; will-change:auto; }
  .mask  { display:inline-block; overflow:hidden; vertical-align:bottom; padding-bottom:0.08em; }
  .word  { display:inline-block; }
  #actor { background:var(--accent); z-index:5; }
  #flood { border-radius:50%; background:var(--ink); z-index:4; }
  #title { z-index:6; font-weight:700; letter-spacing:-0.03em; white-space:nowrap; }
  #label { z-index:6; font-weight:600; white-space:nowrap; color:#fff; }
  .row { z-index:6; background:rgba(255,255,255,.16); overflow:hidden; }
  .fill { position:absolute; left:0; top:0; bottom:0; background:rgba(255,255,255,.55); }
  #sheen { z-index:6; overflow:hidden; }
  #sheen::after { content:""; position:absolute; top:-50%; bottom:-50%; width:30%; left:var(--x, -40%);
                  background:linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent); transform:rotate(12deg); }
  #endcard { z-index:7; font-weight:700; letter-spacing:-0.02em; white-space:nowrap; color:var(--bg); }
</style>
</head>
<body>
<div id="stage">
  <div id="cam">
    <div id="flood" class="layer"></div>
    <div id="actor" class="layer"></div>
    <div id="title" class="layer"></div>
    <div id="label" class="layer"></div>
    <div class="row layer"><i class="fill"></i></div><div class="row layer"><i class="fill"></i></div><div class="row layer"><i class="fill"></i></div>
    <div id="sheen" class="layer"></div>
    <div id="endcard" class="layer"></div>
  </div>
</div>
<script>
// ---------- format ----------
const Q = new URLSearchParams(location.search);
const W = +Q.get('w') || 1920, H = +Q.get('h') || 1080;
const ASPECT = W / H;                      // layouts branch on this, never crop one format into another
const U = Math.min(W, H) / 1080;           // 1 design unit = 1px at 1080 short side
window.FILM = { duration: 6, fps: 60, width: W, height: H };

// ---------- math (exact endpoints: guards like `if (e > 0)` must not fire early) ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const prog = (t, t0, t1) => clamp((t - t0) / (t1 - t0));          // 0..1 over [t0,t1]
const ease = {
  io:   p => p <= 0 ? 0 : p >= 1 ? 1 : (p < .5 ? 4*p*p*p : 1 - Math.pow(-2*p + 2, 3) / 2),
  out:  p => p <= 0 ? 0 : p >= 1 ? 1 : 1 - Math.pow(1 - p, 3),
  in:   p => p <= 0 ? 0 : p >= 1 ? 1 : p*p*p,
  expo: p => p <= 0 ? 0 : p >= 1 ? 1 : (p < .5 ? Math.pow(2, 20*p - 10) / 2 : (2 - Math.pow(2, -20*p + 10)) / 2),
};
// Closed-form damped spring step response (mass 1). Returns 0 at t<=0, settles at 1, may overshoot.
// Presets (stiffness, damping): snappy UI 320/30 · default 170/26 · heavy type/logo 120/24 · playful 180/12
function spring(t, k = 170, d = 26) {
  if (t <= 0) return 0;
  const w0 = Math.sqrt(k), z = d / (2 * w0);
  if (z < 1) { const wd = w0 * Math.sqrt(1 - z*z);
    return 1 - Math.exp(-z*w0*t) * (Math.cos(wd*t) + (z*w0/wd) * Math.sin(wd*t)); }
  if (z === 1) return 1 - Math.exp(-w0*t) * (1 + w0*t);
  const r1 = -w0 * (z - Math.sqrt(z*z - 1)), r2 = -w0 * (z + Math.sqrt(z*z - 1));
  return 1 - (r2 * Math.exp(r1*t) - r1 * Math.exp(r2*t)) / (r2 - r1);
}
// A value retargeted several times = start + sum of one spring per change: keys [[t, value], ...]
function springTo(t, keys, k, d) {
  let v = keys[0][1];
  for (let i = 1; i < keys.length; i++) v += (keys[i][1] - keys[i-1][1]) * spring(t - keys[i][0], k, d);
  return v;
}
// Seeded PRNG: never Math.random
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let r = Math.imul(a ^ a >>> 15, 1 | a);
  r = r + Math.imul(r ^ r >>> 7, 61 | r) ^ r; return ((r ^ r >>> 14) >>> 0) / 4294967296; }; }

// Camera: keys [t, zoom, x, y]; zoom interpolated in log space; eased segments.
function camera(t, keys) {
  if (t <= keys[0][0]) return keys[0].slice(1);
  for (let i = 1; i < keys.length; i++) {
    const [t0, z0, x0, y0] = keys[i-1], [t1, z1, x1, y1] = keys[i];
    if (t <= t1) { const p = ease.io(prog(t, t0, t1));
      return [Math.exp(lerp(Math.log(z0), Math.log(z1), p)), lerp(x0, x1, p), lerp(y0, y1, p)]; }
  }
  return keys[keys.length - 1].slice(1);
}

// ---------- masked word-by-word text ----------
function setWords(el, text) {
  el.innerHTML = text.split(' ').map(w => `<span class="mask"><span class="word">${w}</span></span>`).join(' ');
  return [...el.querySelectorAll('.word')];
}
function riseWords(words, t, t0, stagger = 0.055, out0 = Infinity) {
  words.forEach((w, i) => {
    const pin = spring(t - t0 - i * stagger, 220, 28);                   // in
    const pout = Number.isFinite(out0) ? ease.in(prog(t, out0 + i * 0.03, out0 + i * 0.03 + 0.25)) : 0; // out (leaves before next morph)
    const y = (1 - pin) * 105 - pout * 105;
    w.style.transform = `translateY(${y}%) rotate(${(1 - pin) * 4}deg)`;
  });
}

// ---------- scene setup (constants declared before the first seek) ----------
const $ = id => document.getElementById(id);
const stage = $('stage'), cam = $('cam'), actor = $('actor'), flood = $('flood'), title = $('title'), endcard = $('endcard');
const label = $('label'), sheen = $('sheen'), rows = [...document.querySelectorAll('.row')];
stage.style.width = W + 'px'; stage.style.height = H + 'px';
const titleWords = setWords(title, 'One shape. Every state.');
const labelWords = setWords(label, 'Get started');
const endWords = setWords(endcard, 'yourbrand.com');
const BEAT = 0.5;                      // 120 BPM: every event sits on this grid (see BEATMAP.md)

// Layout per format: positions in px for the current aspect (render 16:9, 9:16, 1:1, 4:5 from one timeline).
function layout() {
  const portrait = ASPECT < 1;
  return {
    titleSize: (portrait ? 104 : 132) * U,
    titleY: portrait ? H * 0.34 : H * 0.36,
    pill: { w: 520 * U, h: 128 * U, y: portrait ? H * 0.50 : H * 0.58 },
    card: { w: (portrait ? 0.86 : 0.64) * W, h: (portrait ? 0.46 : 0.62) * H },   // lead subject fills 60-85%
  };
}
const L = layout();
// Show/hide layers with visibility:inherit, never "visible" (a "visible" child leaks out of a hidden parent)
const show = (el, on) => { el.style.visibility = on ? 'inherit' : 'hidden'; };
const center = (el, x, y) => { el.style.left = (x - el.offsetWidth / 2) + 'px'; el.style.top = (y - el.offsetHeight / 2) + 'px'; };

// ---------- the film (6 s, 120 BPM) ----------
// 0.0  frame 0 is a finished composition: headline + button already on screen, camera drifting
// 1.0  headline + label leave first, THEN the button morphs into the product card (shared element)
// 1.5  rows cascade in after the card has started growing
// 3.0  rows leave, card contracts to a disc
// 4.0  drop: the disc floods the frame (clears the farthest corner in ~0.33 s); end card rides the flood
window.seek = async (t) => {
  const [z, cx, cy] = camera(t, [[0, 1.0, 0, 0], [4, 1.07, 0, -12 * U], [6, 1.1, 0, -12 * U]]);   // one direction only
  cam.style.transform = `translate(${cx}px, ${cy}px) scale(${z})`;

  // headline: present at t=0, leaves on beat 2 before anything morphs
  title.style.fontSize = L.titleSize + 'px';
  center(title, W / 2, L.titleY);
  riseWords(titleWords, t, -1, 0.055, 1.0);

  // the persistent actor: button -> card -> disc -> flood
  const toCard = spring(t - 1.15, 170, 26), toDisc = spring(t - 3.2, 320, 30);
  const disc = 140 * U * (1 + 0.35 * ease.in(prog(t, 3.45, 4.0)));   // anticipation: the disc winds up into the drop
  const aw = lerp(lerp(L.pill.w, L.card.w, toCard), disc, toDisc);
  const ah = lerp(lerp(L.pill.h, L.card.h, toCard), disc, toDisc);
  const ar = lerp(lerp(L.pill.h / 2, 40 * U, toCard), disc / 2, toDisc);
  const ay = lerp(lerp(L.pill.y, H / 2, toCard), H / 2, toDisc);
  Object.assign(actor.style, { width: aw + 'px', height: ah + 'px', borderRadius: ar + 'px',
    left: (W / 2 - aw / 2) + 'px', top: (ay - ah / 2) + 'px' });
  show(actor, t < 4.34);

  // tertiary detail so the opening never holds still: a sheen sweeps the button twice before the morph
  Object.assign(sheen.style, { width: aw + 'px', height: ah + 'px', borderRadius: ar + 'px', left: (W / 2 - aw / 2) + 'px',
    top: (ay - ah / 2) + 'px', opacity: t < 1.1 ? 1 : 0 });
  sheen.style.setProperty('--x', lerp(-40, 130, ease.io(prog(t % 0.5, 0, 0.5))) + '%');

  // label rides inside the button in its own mask; leaves before the morph
  label.style.fontSize = 52 * U + 'px';
  center(label, W / 2, ay);
  riseWords(labelWords, t, -1, 0.04, 1.0);

  // card rows: enter after the container starts growing, leave before it contracts
  rows.forEach((r, i) => {
    const pin = spring(t - 1.5 - i * 0.12, 220, 28), pout = ease.in(prog(t, 2.95 + i * 0.04, 3.2 + i * 0.04));
    const rw = L.card.w * 0.84, rh = L.card.h * 0.18;
    Object.assign(r.style, { width: rw + 'px', height: rh + 'px', borderRadius: 18 * U + 'px',
      left: (W / 2 - rw / 2) + 'px', top: (H / 2 - L.card.h * 0.33 + i * rh * 1.25 - rh / 2 + (1 - pin) * 40 * U) + 'px',
      opacity: clamp(pin) * (1 - pout) });
    // each row does work while the card holds: progress fills on the beat (cause -> effect)
    r.firstChild.style.width = 100 * ease.out(prog(t, 1.9 + i * 0.35, 2.6 + i * 0.35)) + '%';
  });

  // flood from the disc on the drop: must clear the farthest corner (hypot x1.05)
  const R = 1.05 * Math.max(...[[0, 0], [W, 0], [0, H], [W, H]].map(([x, y]) => Math.hypot(x - W / 2, y - H / 2)));
  const fr = lerp(disc / 2, R, ease.expo(prog(t, 4.0, 4.33)));
  Object.assign(flood.style, { width: 2 * fr + 'px', height: 2 * fr + 'px', left: (W / 2 - fr) + 'px', top: (H / 2 - fr) + 'px',
    opacity: t < 4.0 ? 0 : 1 });

  // end card: heavy spring, readable >= 1.5 s, slow drift keeps it alive
  endcard.style.fontSize = 120 * U + 'px';
  center(endcard, W / 2, H / 2 - (t - 4.3) * 5 * U);
  riseWords(endWords, t, 4.25, 0.06);
};

// ---------- ready + preview (preview-only code never runs during render) ----------
(async () => {
  await document.fonts.ready;
  await Promise.all([...document.images].map(i => i.decode().catch(() => {})));
  await window.seek(+Q.get('t') || 0);
  window.ready = true;
  if (Q.has('play')) { const t0 = performance.now(); // preview-only
    const loop = () => { window.seek(((performance.now() - t0) / 1000) % FILM.duration); requestAnimationFrame(loop); }; // preview-only
    requestAnimationFrame(loop); } // preview-only
})();
</script>
</body>
</html>
